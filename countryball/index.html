<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nation Battle Arcade</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background: #08090f;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Animated RGB Border Keyframes */
    @keyframes rgbGlow {
      0% { border-color: #ff0055; box-shadow: 0 0 30px rgba(255, 0, 85, 0.6); }
      20% { border-color: #ffaa00; box-shadow: 0 0 30px rgba(255, 170, 0, 0.6); }
      40% { border-color: #05ffa1; box-shadow: 0 0 30px rgba(5, 255, 161, 0.6); }
      60% { border-color: #00f0ff; box-shadow: 0 0 30px rgba(0, 240, 255, 0.6); }
      80% { border-color: #a000ff; box-shadow: 0 0 30px rgba(160, 0, 255, 0.6); }
      100% { border-color: #ff0055; box-shadow: 0 0 30px rgba(255, 0, 85, 0.6); }
    }

    #game-container {
      position: relative;
      width: min(360px, 100vw);
      height: min(640px, 100vh);
      aspect-ratio: 9 / 16;
      background: #121420;
      border: 4px solid #ff0055;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(255, 0, 85, 0.5);
      overflow: hidden;
      animation: rgbGlow 5s linear infinite;
      touch-action: none;
    }

    /* Background image styling */
    #ring-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.35;
      z-index: 0;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1; 
      touch-action: none;
    }

    .screen {
      position: absolute;
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 10px;
      background: rgba(18, 20, 32, 0.95);
      z-index: 10;
      overflow: hidden;
    }

    .hidden {
      display: none !important;
    }

    /* PRESS ANY BUTTON BLINK ANIMATION */
    .press-start {
      font-size: 18px;
      font-weight: bold;
      color: #ffe600;
      text-shadow: 2px 2px #ff0055;
      animation: blinkText 0.7s infinite alternate;
      cursor: pointer;
      text-align: center;
    }

    @keyframes blinkText {
      0% { opacity: 0.15; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }

    h1 {
      font-size: 22px;
      color: #05ffa1;
      text-transform: uppercase;
      text-shadow: 2px 2px #ff0055;
      margin-bottom: 4px;
      text-align: center;
      font-weight: 900;
    }

    /* SELECTION DISPLAY VS BANNER */
    .selection-display {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 8px 0;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      min-height: 40px;
    }

    .player-slot {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      max-width: 42%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .player-slot.p1 {
      color: #00f0ff;
    }

    .player-slot.p2 {
      color: #ff0055;
    }

    .vs-flag-img {
      width: 26px;
      height: 18px;
      object-fit: cover;
      border-radius: 3px;
      border: 1px solid #fff;
      flex-shrink: 0;
    }

    .vs {
      color: #ffe600;
      font-family: 'Impact', sans-serif;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 1px 1px #ff0055;
    }

    /* --- GRID & MOBILE SCROLLBAR FIX --- */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
      flex: 1;
      min-height: 0; /* Allows flex box child to shrink and overflow-scroll */
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
      margin: 6px 0;
      scrollbar-width: thin;
      scrollbar-color: #ff0055 #0d0f18;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch; /* Mobile iOS momentum scroll */
    }

    /* Webkit (Chrome, Edge, Safari) Scrollbar Styling */
    .grid::-webkit-scrollbar {
      width: 6px;
    }

    .grid::-webkit-scrollbar-track {
      background: #0d0f18;
      border-radius: 4px;
    }

    .grid::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #ff0055 0%, #00f0ff 100%);
      border-radius: 4px;
      box-shadow: 0 0 8px #ff0055;
    }

    .grid::-webkit-scrollbar-thumb:hover {
      background: #ffe600;
    }

    .card, .card * {
      touch-action: pan-y; /* Enable touch dragging across cards */
    }

    .card {
      background: #1c2035;
      border: 2px solid #353b5e;
      border-radius: 8px;
      padding: 6px 2px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .card:hover {
      border-color: #05ffa1;
      transform: translateY(-2px);
    }

    .card.selected-a {
      border-color: #00f0ff;
      background: #084358;
      box-shadow: 0 0 10px #00f0ff;
    }

    .card.selected-b {
      border-color: #ff0055;
      background: #580823;
      box-shadow: 0 0 10px #ff0055;
    }

    .flag-box {
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 3px;
    }

    .flag-img {
      max-width: 40px;
      max-height: 25px;
      object-fit: cover;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .card .name {
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ffffff;
    }

    .card .stats {
      font-size: 9px;
      font-weight: bold;
      color: #05ffa1;
      margin-top: 2px;
    }

    .btn {
      background: #ff0055;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      font-family: inherit;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 4px 0 #990033;
      transition: all 0.1s;
      width: 85%;
      margin: 4px 0;
      flex-shrink: 0;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #990033;
    }

    .btn-secondary {
      background: #00f0ff;
      color: #000;
      box-shadow: 0 4px 0 #00808c;
    }

    .btn-secondary:active {
      box-shadow: 0 0 0 #00808c;
    }

    /* --- FULL-WIDTH OVERLAY BANNER SYSTEM --- */
    #banner-overlay {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      transform: translateY(-50%) scale(0);
      background: rgba(8, 9, 15, 0.95);
      border-top: 3px solid #ffe600;
      border-bottom: 3px solid #ff0055;
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.8);
      padding: 14px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.25), opacity 0.15s ease;
    }

    #banner-overlay.show {
      transform: translateY(-50%) scale(1);
      opacity: 1;
    }

    #banner-text {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-style: italic;
      font-weight: 900;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.1;
      letter-spacing: 2px;
      width: 100%;
    }

    .banner-choose {
      font-size: clamp(20px, 5vw, 28px) !important;
      color: #ffe600;
      text-shadow: 2px 2px 0 #ff0055, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 0 15px #ffe600;
    }

    .banner-ready {
      font-size: clamp(32px, 8vw, 44px) !important;
      color: #ffe600;
      text-shadow: 3px 3px 0 #ff0055, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 0 0 20px #ffe600;
    }

    .banner-fight {
      font-size: clamp(38px, 10vw, 54px) !important;
      color: #ff0055;
      text-shadow: 4px 4px 0 #ffe600, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 0 0 25px #ff0055;
      animation: fightShake 0.12s infinite alternate;
    }

    .banner-ult {
      font-size: clamp(18px, 5vw, 24px) !important;
      color: #ffe600;
      text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 0 15px #ffe600;
      animation: fightShake 0.1s infinite alternate;
    }

    @keyframes fightShake {
      0% { transform: scale(1.0) rotate(-1deg); }
      100% { transform: scale(1.08) rotate(1deg); }
    }

    /* RETRO VICTORY SCREEN */
    #screen-winner {
      background: rgba(8, 9, 15, 0.92);
      justify-content: center;
      gap: 20px;
      z-index: 20;
    }

    .victory-ribbon {
      width: 100%;
      background: linear-gradient(90deg, rgba(255, 0, 85, 0.3) 0%, rgba(18, 20, 32, 0.95) 20%, rgba(18, 20, 32, 0.95) 80%, rgba(255, 0, 85, 0.3) 100%);
      border-top: 3px solid #ffe600;
      border-bottom: 3px solid #00f0ff;
      box-shadow: 0 0 30px rgba(255, 230, 0, 0.4);
      padding: 20px 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .victory-title {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-style: italic;
      font-size: 42px;
      color: #ffe600;
      letter-spacing: 3px;
      text-shadow: 3px 3px 0 #ff0055, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 0 20px #ffe600;
      margin-bottom: 12px;
      animation: winnerPulse 0.8s infinite alternate;
    }

    @keyframes winnerPulse {
      0% { transform: scale(1.0); }
      100% { transform: scale(1.05); }
    }

    .winner-flag-frame {
      width: 130px;
      height: 80px;
      border: 3px solid #ffe600;
      border-radius: 6px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .winner-flag-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .winner-name {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 26px;
      color: #05ffa1;
      letter-spacing: 1.5px;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 0 12px #05ffa1;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .winner-stats {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      font-weight: bold;
      color: #ffe600;
      text-shadow: 1px 1px 2px #000;
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 12px;
      border-radius: 4px;
      border: 1px solid rgba(255, 230, 0, 0.3);
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- FULL-WIDTH OG ARCADE BANNER STRIP (Z-INDEX: 100) -->
  <div id="banner-overlay">
    <div id="banner-text"></div>
  </div>

  <!-- 0. START SCREEN -->
  <div id="screen-start" class="screen">
    <div style="text-align:center; margin-top: 100px;">
      <h1 style="font-size: 28px; letter-spacing: 2px;">COUNTRYBALL<br><span style="color:#ffe600; font-size:34px;">ARENA</span></h1>
      <div style="font-size: 12px; color: #8e95b7; margin-top: 10px; font-weight: bold;">2D ARCADE WAR</div>
    </div>

    <div class="press-start">PRESS ANY BUTTON</div>

    <div style="font-size: 11px; color: #555d88; margin-bottom: 28px; font-weight: bold;">LIKE, FOLLOW, AND SUBSCRIBE • 2026 EDITION</div>
  </div>

  <!-- 1. MENU SCREEN -->
  <div id="screen-menu" class="screen hidden">
    <div style="width: 100%;">
      <h1>CHOOSE YOUR FIGHTER</h1>
      <div class="selection-display">
        <div id="label-a" class="player-slot p1"><span>SELECT P1</span></div>
        <span class="vs">VS</span>
        <div id="label-b" class="player-slot p2"><span>SELECT P2</span></div>
      </div>
    </div>
    
    <div class="grid" id="country-grid"></div>

    <button id="btn-fight" class="btn" style="opacity:0.4; pointer-events:none;">FIGHT!</button>
  </div>

  <!-- 3. RETRO VICTORY SCREEN -->
  <div id="screen-winner" class="screen hidden">
    <div class="victory-ribbon">
      <div class="victory-title">VICTORY!</div>
      
      <div class="winner-flag-frame">
        <img id="winner-flag-img" src="" alt="Winner Flag">
      </div>

      <div id="winner-name" class="winner-name">USA WINS!</div>
      <div id="winner-hp" class="winner-stats">REMAINING HP: 45 / 100</div>
    </div>

    <div style="width:100%; display:flex; flex-direction:column; align-items:center;">
      <button id="btn-rematch" class="btn">REMATCH</button>
      <button id="btn-select" class="btn btn-secondary">SELECT AGAIN</button>
    </div>
  </div>

  <!-- Background Image Tag -->
  <img id="ring-background" src="" alt="Ring Background">

  <!-- 2. BATTLE CANVAS -->
  <canvas id="battleCanvas" width="360" height="640"></canvas>
</div>

<!-- MODULE SCRIPTS -->
<script src="js/countries.js"></script>
<script src="js/abilities.js"></script>
<script src="js/audio.js"></script>
<script src="js/menu.js"></script>
<script src="js/passive.js"></script>
<script src="js/battle.js"></script>
<script src="js/main.js"></script>

<!-- MOBILE TOUCH AUDIO UNLOCKER -->
<script>
  (function initMobileSupport() {
    function unlockAudio() {
      if (window.AudioSystem && window.AudioSystem.unlock) {
        window.AudioSystem.unlock();
      }
      window.removeEventListener('touchstart', unlockAudio);
      window.removeEventListener('click', unlockAudio);
    }

    window.addEventListener('touchstart', unlockAudio, { once: true });
    window.addEventListener('click', unlockAudio, { once: true });
  })();
</script>
</body>
</html>
