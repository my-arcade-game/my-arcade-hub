<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Inline Favicon (Stops /favicon.ico 404 errors) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">
  
  <title>Side Project Arcade</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background: #08090f;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    @keyframes rgbGlow {
      0% { border-color: #ff0055; box-shadow: 0 0 25px rgba(255, 0, 85, 0.5); }
      25% { border-color: #00f0ff; box-shadow: 0 0 25px rgba(0, 240, 255, 0.5); }
      50% { border-color: #05ffa1; box-shadow: 0 0 25px rgba(5, 255, 161, 0.5); }
      75% { border-color: #ffe600; box-shadow: 0 0 25px rgba(255, 230, 0, 0.5); }
      100% { border-color: #ff0055; box-shadow: 0 0 25px rgba(255, 0, 85, 0.5); }
    }

    #hub-container {
      position: relative;
      width: min(360px, 100vw);
      height: min(640px, 100vh);
      aspect-ratio: 9 / 16;
      background: #121420;
      border: 4px solid #ff0055;
      border-radius: 12px;
      overflow: hidden;
      animation: rgbGlow 6s linear infinite;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 14px;
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-top: 10px;
    }

    .badge {
      font-size: 10px;
      font-weight: bold;
      color: #00f0ff;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: rgba(0, 240, 255, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      display: inline-block;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 24px;
      color: #ffe600;
      text-transform: uppercase;
      text-shadow: 2px 2px #ff0055;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .sub-title {
      font-size: 11px;
      color: #8e95b7;
      margin-top: 4px;
      font-weight: bold;
    }

    /* GAME LIST */
    .game-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      margin: 10px 0;
    }

    .game-card {
      background: #1c2035;
      border: 2px solid #353b5e;
      border-radius: 10px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }

    .game-card:active {
      transform: scale(0.98);
    }

    .game-card.countryball {
      border-color: #ff0055;
    }
    .game-card.countryball:active {
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
    }

    .game-card.earth {
      border-color: #05ffa1;
    }
    .game-card.earth:active {
      box-shadow: 0 0 15px rgba(5, 255, 161, 0.6);
    }

    .game-icon {
      font-size: 32px;
      width: 50px;
      height: 50px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .game-info {
      flex: 1;
      overflow: hidden;
    }

    .game-title {
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .game-desc {
      font-size: 10px;
      color: #8e95b7;
      margin-top: 3px;
      line-height: 1.3;
    }

    .play-btn {
      font-size: 11px;
      font-weight: bold;
      color: #000;
      padding: 6px 12px;
      border-radius: 4px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .game-card.countryball .play-btn {
      background: #ff0055;
      color: #fff;
    }

    .game-card.earth .play-btn {
      background: #05ffa1;
      color: #000;
    }

    /* FOOTER */
    .footer {
      text-align: center;
      margin-bottom: 8px;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .social-btn {
      font-size: 11px;
      color: #00f0ff;
      text-decoration: none;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .social-btn:active {
      background: rgba(0, 240, 255, 0.3);
    }

    .footer-text {
      font-size: 10px;
      color: #555d88;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

<div id="hub-container">
  <!-- HEADER -->
  <div class="header">
    <div class="badge">Side Projects Hub</div>
    <h1>SELECT A GAME</h1>
    <div class="sub-title">Tap a game below to play immediately</div>
  </div>

  <!-- GAME SELECTION CARDS -->
  <div class="game-list">
    <!-- Game 1: Countryball Arena -->
    <a href="./countryball/index.html" class="game-card countryball">
      <div class="game-icon">⚔️</div>
      <div class="game-info">
        <div class="game-title">Countryball Arena</div>
        <div class="game-desc">2D Arcade War featuring unique skills & country balls.</div>
      </div>
      <div class="play-btn">PLAY</div>
    </a>

    <!-- Game 2: Earth Detective -->
    <a href="./earth-detective/index.html" class="game-card earth">
      <div class="game-icon">🌍</div>
      <div class="game-info">
        <div class="game-title">Earth Detective</div>
        <div class="game-desc">Explore locations, solve geography puzzles & find clues.</div>
      </div>
      <div class="play-btn">PLAY</div>
    </a>
  </div>

  <!-- FOOTER & SOCIALS -->
  <div class="footer">
    <div class="social-links">
      <a href="https://tiktok.com" target="_blank" class="social-btn">📱 TikTok</a>
      <a href="https://github.com" target="_blank" class="social-btn">💻 GitHub</a>
    </div>
    <div class="footer-text">MADE WITH JavaScript • 2026 EDITION</div>
  </div>
</div>

</body>
</html>
