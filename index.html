<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Arcade Hub</title>
    <!-- Load Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: white; text-align: center; padding: 2rem; }
        .container { max-width: 600px; margin: 0 auto; background: #16213e; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button { background: #0f3460; color: white; border: none; padding: 10px 20px; font-size: 1.2rem; cursor: pointer; border-radius: 5px; margin: 10px; }
        button:hover { background: #e94560; }
        input { padding: 10px; font-size: 1.2rem; border-radius: 5px; border: none; text-align: center; margin-bottom: 10px; }
        .hidden { display: none; }
        .game-card { border: 2px solid #0f3460; margin: 15px 0; padding: 15px; border-radius: 8px; }
        #room-info { background: #e94560; padding: 10px; border-radius: 5px; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>My Arcade Hub</h1>

        <!-- LOBBY SCREEN: Shown first -->
        <div id="lobby-screen">
            <h2>Multiplayer Lobby</h2>
            <button id="btn-create">Create Room (Host)</button>
            <hr style="border-color: #0f3460; margin: 20px 0;">
            <input type="text" id="room-input" placeholder="Enter 6-Letter Code" maxlength="6">
            <br>
            <button id="btn-join">Join Room</button>
        </div>

        <!-- ARCADE MENU: Shown only inside a room -->
        <div id="hub-menu" class="hidden">
            <div id="room-info">Room Code: <span id="display-code">...</span> | Players: <span id="player-count">1</span>/2</div>
            
            <p id="waiting-msg">Waiting for Host to start a game...</p>

            <div id="game-list" class="hidden">
                <h2>Select a Game</h2>
                
                <div class="game-card">
                    <h3>Countryball Arena</h3>
                    <p>Automatic battle simulator.</p>
                    <button class="play-btn" data-url="./countryball/index.html">Play Countryball</button>
                </div>

                <div class="game-card">
                    <h3>Earth Detective</h3>
                    <p>GeoGuessr-style location guessing.</p>
                    <button class="play-btn" data-url="./earth-detective/index.html">Play Earth Detective</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN LOGIC -->
    <script type="module">
        import { Multiplayer } from './shared/multiplayer.js';

        const lobbyScreen = document.getElementById('lobby-screen');
        const hubMenu = document.getElementById('hub-menu');
        const displayCode = document.getElementById('display-code');
        const playerCount = document.getElementById('player-count');
        const gameList = document.getElementById('game-list');
        const waitingMsg = document.getElementById('waiting-msg');
        
        // Initialize Supabase Auth & check for existing room in URL
        await Multiplayer.init();

        function showArcade() {
            lobbyScreen.classList.add('hidden');
            hubMenu.classList.remove('hidden');
            displayCode.innerText = Multiplayer.roomCode;

            // Only the Host sees the game selection buttons
            if (Multiplayer.isHost) {
                gameList.classList.remove('hidden');
                waitingMsg.classList.add('hidden');
            } else {
                gameList.classList.add('hidden');
                waitingMsg.classList.remove('hidden');
            }
        }

        // If we auto-joined via URL, show the arcade immediately
        if (Multiplayer.roomCode) {
            showArcade();
        }

        // Real-time Event Hooks
        Multiplayer.onPlayersUpdate = (players) => {
            playerCount.innerText = players.length;
        };

        // Triggered via broadcast event for all connected clients (including Host)
        Multiplayer.onGameStart = (gameUrl) => {
            window.location.href = gameUrl;
        };

        // UI Event Listeners
        document.getElementById('btn-create').addEventListener('click', async () => {
            const success = await Multiplayer.createRoom();
            if (success) showArcade();
        });

        document.getElementById('btn-join').addEventListener('click', async () => {
            const code = document.getElementById('room-input').value.trim();
            if (code.length === 6) {
                const success = await Multiplayer.joinRoom(code);
                if (success) showArcade();
            } else {
                alert("Please enter a valid 6-letter room code.");
            }
        });

        // Attach event listeners to all Play buttons (Host only)
        document.querySelectorAll('.play-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const gamePath = e.target.getAttribute('data-url');
                await Multiplayer.broadcastStartGame(gamePath);
            });
        });
    </script>
</body>
</html>
