<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Earth Detective: Survival</title>
    
    <!-- Google Fonts for Arcade UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <audio id="bgm" preload="auto" src="bgm_1.mp3"></audio>
    <audio id="sfx-ticking" loop preload="auto" src="ticking.mp3"></audio>
    <audio id="sfx-guess" preload="auto" src="guess.mp3"></audio>
    <audio id="sfx-lose" preload="auto" src="lose.mp3"></audio>
    <audio id="sfx-win" preload="auto" src="win_1.mp3"></audio>

    <!-- MOBILE ARCADE CABINET CONTAINER -->
    <div id="game-container">

        <!-- 1. MAIN MENU SCREEN -->
        <div id="main-menu" class="screen">
            <h1 id="ui-title">Earth Detective: Survival</h1>
            
            <div class="menu-box">
                <label for="starting-hp" id="ui-hp-label">Starting HP:</label>
                <input type="number" id="starting-hp" min="1000" max="50000" step="1000" value="10000">

                <label for="timer-setting" id="ui-timer-label">Round Timer:</label>
                <select id="timer-setting">
                    <option value="15">15 Seconds (Chaos)</option>
                    <option value="30" selected>30 Seconds (Normal)</option>
                    <option value="60">60 Seconds (Relaxed)</option>
                    <option value="9999">Infinite (No Timer)</option>
                </select>

                <label id="ui-players-label">Number of Players:</label>
                <div id="player-buttons" class="button-group">
                    <button class="player-btn active" data-count="2">2</button>
                    <button class="player-btn" data-count="3">3</button>
                    <button class="player-btn" data-count="4">4</button>
                    <button class="player-btn" data-count="5">5</button>
                </div>
                
                <label for="language-select" id="ui-lang-label">Language:</label>
                <select id="language-select">
                    <option value="en">English</option>
                    <option value="id">Bahasa Indonesia</option>
                </select>

                <button id="start-game-btn">Start Game</button>
                <button id="toggle-music-btn">🔊 Music: OFF</button>
            </div>
        </div>

        <!-- 2. TURN ANNOUNCEMENT SCREEN -->
        <div id="turn-screen" class="screen" style="display: none;">
            <h1 id="player-turn-text">Player 1's Turn</h1>
            <h2 id="player-hp-text">HP: 10000 ❤️</h2>
            <button id="begin-turn-btn">I'm Ready</button>
        </div>

        <!-- 3. GAMEPLAY SCREEN -->
        <div id="game-screen" class="screen" style="display: none;">
            <div id="game-header-arena">
                <div id="all-players-health-container"></div>
                <div id="timer-display">⏱️: 30s</div>
            </div>

            <div id="street-view">
                <img id="location-photo" src="" alt="Location Photo">
            </div>

            <!-- TOGGLEABLE MAP CONTAINER -->
            <div id="guess-map-container">
                <div id="map-header">
                    <span id="map-header-title">📍 SELECT LOCATION</span>
                    <button id="close-map-btn" type="button">✖ Close</button>
                </div>
                <div id="map"></div>
                <button id="guess-btn" type="button">Make Guess</button>
            </div>

            <!-- COMPACT CENTERED BOTTOM TOGGLE BUTTON -->
            <button id="fixed-map-toggle-btn" type="button">🗺️ Close Map</button>
        </div>

        <!-- 4. IN-GAME CUSTOM MODAL POPUP -->
        <div id="custom-modal" class="modal-overlay" style="display: none;">
            <div class="modal-card">
                <div id="modal-message"></div>
                <button id="modal-ok-btn">OK</button>
            </div>
        </div>

    </div>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>

    <!-- MOBILE TOUCH AUDIO UNLOCKER -->
    <script>
      (function initMobileSupport() {
        function handleFirstTouch() {
          if (window.unlockAllAudio) {
            window.unlockAllAudio();
          }
          window.removeEventListener('touchstart', handleFirstTouch);
          window.removeEventListener('click', handleFirstTouch);
        }
        window.addEventListener('touchstart', handleFirstTouch, { once: true });
        window.addEventListener('click', handleFirstTouch, { once: true });
      })();
    </script>
</body>
</html>
